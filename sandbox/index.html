<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Banner</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Welcome to Our Website</h1>
                <p>Discover amazing experiences and transform your journey with us</p>
                <div tabindex="0" data-type="itsatrap-button">Find out more </div>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" tabindex="0">&times;</span>
            <div id="modal-body">                <div  data-type="trap-door" tabindex="0">Government services are for everyone. Accessibility ensures people with disabilities can access information, complete tasks, and receive services without barriers.</div>
            </div>
        </div>
    </div>
</body>
</html>
